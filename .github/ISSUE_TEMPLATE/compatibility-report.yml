name: Compatibility report
description: Tell us what worked or failed when you used this plugin in Codex, Cursor or another tool.
title: "Compatibility: <tool> <version>"
body:
  - type: markdown
    attributes:
      value: |
        The maintainer cannot run Codex or Cursor, so reports from people who can are how we find out what really works. Thank you.
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Codex CLI
        - Codex desktop app
        - Cursor
        - Claude Code
        - Other
    validations:
      required: true
  - type: input
    id: tool-version
    attributes:
      label: Tool version
      description: Output of the tool's version command, or the app version.
      placeholder: "e.g. codex 0.0.0 / Cursor 0.0.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps you tried
      description: The exact commands or clicks you used to install and invoke the plugin, in order.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result
      description: What happened versus what you expected. Include error text, and which skills did or did not load.
    validations:
      required: true
