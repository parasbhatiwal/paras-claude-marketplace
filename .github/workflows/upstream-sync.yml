name: upstream-sync

# Weekly: if Matt Pocock's skills (MIT) moved since the baseline in
# upstream.json, have an agent adapt what helps, bump the plugin's minor
# version, refresh the baseline, and open ONE pull request. A human reviews and
# merges; release-stable.yml then publishes. Nothing here merges or releases.
#
# One-time setup (secrets are set by you, never by an agent):
#   claude setup-token            # in your own terminal; uses your Claude plan
#   pbpaste | gh secret set CLAUDE_CODE_OAUTH_TOKEN
#   Settings > Actions > General > "Allow GitHub Actions to create pull requests"
# Optional: gh secret set UPSTREAM_SYNC_TOKEN (a PAT) so the validate workflow
# also runs on the PR; PRs opened with the default token do not trigger it. The
# job runs lint, validate and tests itself either way.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      BRANCH: upstream-sync/auto
      ISSUE_TITLE: "Upstream changes in mattpocock/skills to review"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Skip while a previous sync PR is still open
        id: open
        run: |
          n=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then echo "PR #$n is still open; review it first."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Fetch upstream (full history, to diff from the baseline)
        if: steps.open.outputs.skip != 'true'
        run: git clone https://github.com/mattpocock/skills "$RUNNER_TEMP/upstream"

      - name: Diff against the recorded baseline
        id: diff
        if: steps.open.outputs.skip != 'true'
        run: |
          node scripts/upstream-diff.mjs "$RUNNER_TEMP/upstream" > "$RUNNER_TEMP/report.md"
          if [ -s "$RUNNER_TEMP/report.md" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Close the tracking issue once upstream matches again
        if: steps.diff.outputs.changed == 'false'
        run: |
          n=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")
          [ -n "$n" ] && gh issue close "$n" --comment "Upstream matches the baseline again." || true

      - name: Prepare the branch, the patch and the pre-made version bump
        id: prep
        if: steps.diff.outputs.changed == 'true'
        run: |
          VERSION=$(node -p "require('./upstream.json').version")
          PATHS=$(node -p "require('./upstream.json').ported.map(p => p.upstream).join(' ')")
          BASE=$(git -C "$RUNNER_TEMP/upstream" log --format=%H -S"\"version\": \"$VERSION\"" -- package.json | tail -1)
          if [ -n "$BASE" ]; then
            # shellcheck disable=SC2086
            git -C "$RUNNER_TEMP/upstream" diff "$BASE" HEAD -- $PATHS > "$RUNNER_TEMP/upstream.patch"
          else
            : > "$RUNNER_TEMP/upstream.patch"
          fi
          NEXT=$(node scripts/upstream-guard.mjs next-version)
          UPSTREAM_NOW=$(node -p "require('$RUNNER_TEMP/upstream/package.json').version")
          node -e "
            const fs=require('fs');const p='plugins/team-skills/.claude-plugin/plugin.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='$NEXT';
            fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');"
          git checkout -b "$BRANCH"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "upstream_now=$UPSTREAM_NOW" >> "$GITHUB_OUTPUT"

      - name: Adapt the changes
        if: steps.diff.outputs.changed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          prompt: |
            Follow .github/prompts/upstream-sync.md exactly.
            NEXT_VERSION=${{ steps.prep.outputs.next }}
            UPSTREAM_VERSION_NOW=${{ steps.prep.outputs.upstream_now }}
            report.md: ${{ runner.temp }}/report.md
            upstream.patch: ${{ runner.temp }}/upstream.patch
            upstream checkout (read-only): ${{ runner.temp }}/upstream
            Write the PR description to: ${{ runner.temp }}/pr-body.md
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(npm run lint),Bash(npm run validate),Bash(npm test)"

      - name: Reject edits outside the allowed files
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/upstream-guard.mjs check-paths HEAD

      - name: Gates
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run lint
          npm run validate
          npm test

      - name: Decide release PR or acknowledge-only PR
        id: kind
        if: steps.diff.outputs.changed == 'true'
        run: |
          if node scripts/upstream-guard.mjs has-plugin-changes HEAD; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            # Nothing adopted: no new plugin version, no changelog entry.
            git checkout -- plugins/team-skills/.claude-plugin/plugin.json CHANGELOG.md
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh the baseline
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/upstream-diff.mjs "$RUNNER_TEMP/upstream" --write-baseline

      - name: Commit, push, open the PR
        if: steps.diff.outputs.changed == 'true'
        env:
          RELEASE: ${{ steps.kind.outputs.release }}
          NEXT: ${{ steps.prep.outputs.next }}
          UPSTREAM_NOW: ${{ steps.prep.outputs.upstream_now }}
        run: |
          git config user.name "upstream-sync[bot]"
          git config user.email "upstream-sync@users.noreply.github.com"
          if [ "$RELEASE" = "true" ]; then
            TITLE="feat: adopt upstream AI Hero changes ($UPSTREAM_NOW) -> $NEXT"
          else
            TITLE="chore: acknowledge upstream AI Hero $UPSTREAM_NOW (nothing adopted)"
          fi
          git add -A
          git commit -q -m "$TITLE" -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          # Compares committed history, so it must run after the commit.
          node scripts/check-version-bump.mjs origin/main
          git push -q --force-with-lease origin "$BRANCH"
          [ -s "$RUNNER_TEMP/pr-body.md" ] || echo "The agent wrote no description; read the diff." > "$RUNNER_TEMP/pr-body.md"
          printf '\n---\nOpened by the weekly upstream-sync workflow. Merging publishes to `stable` automatically if the plugin version moved.\n' >> "$RUNNER_TEMP/pr-body.md"
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"

      - name: On failure, leave the report as an issue instead
        if: failure() && steps.diff.outputs.changed == 'true'
        run: |
          { cat "$RUNNER_TEMP/report.md"; printf '\nThe automated adaptation failed (see the workflow run); port by hand.\n'; } > "$RUNNER_TEMP/issue.md"
          n=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")
          if [ -n "$n" ]; then gh issue edit "$n" --body-file "$RUNNER_TEMP/issue.md"; else gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/issue.md"; fi
