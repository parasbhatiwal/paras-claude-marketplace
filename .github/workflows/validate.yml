name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check hook and script sources
        run: npm run lint
      - name: Syntax-check the shell templates
        run: |
          for f in examples/githooks/* examples/*.sh; do
            [ -f "$f" ] && sh -n "$f"
          done
      - name: Lint the shell templates
        # -x follows the sourced _lib.sh; run from the hooks directory so the
        # `# shellcheck source=_lib.sh` directives resolve.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          (cd examples/githooks && shellcheck -s sh -x _lib.sh commit-msg pre-commit pre-push)
          shellcheck -s sh examples/*.sh
      - name: Validate marketplace, plugins, skills, hooks
        run: npm run validate
      # The shipped gitleaks config is a security control with its own tests;
      # without the binary they skip silently, which is precisely where a
      # regression would slip through unnoticed.
      - name: Install gitleaks (required by the config tests)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Tests
        run: npm test
      - name: Plugin version must move when skills or hooks change
        if: github.event_name == 'pull_request'
        run: node scripts/check-version-bump.mjs "origin/${{ github.base_ref }}"
